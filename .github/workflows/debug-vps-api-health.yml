name: Debug VPS API health

on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-24.04
    environment: vps-production
    steps:
      - name: Install SSH key
        shell: bash
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_SSH_PORT: ${{ vars.VPS_SSH_PORT || '22' }}
        run: |
          test -n "${VPS_SSH_KEY}"
          test -n "${VPS_HOST}"
          install -m 700 -d ~/.ssh
          printf '%s\n' "${VPS_SSH_KEY}" > ~/.ssh/id_vps
          chmod 600 ~/.ssh/id_vps
          ssh-keyscan -p "${VPS_SSH_PORT}" -H "${VPS_HOST}" >> ~/.ssh/known_hosts

      - name: Inspect API container
        shell: bash
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER || vars.VPS_USER || 'clipbr' }}
          VPS_SSH_PORT: ${{ vars.VPS_SSH_PORT || '22' }}
          VPS_APP_DIR: ${{ vars.VPS_APP_DIR || '/srv/clipbr/app' }}
        run: |
          ssh -i ~/.ssh/id_vps -p "${VPS_SSH_PORT}" "${VPS_USER}@${VPS_HOST}" \
            "cd '${VPS_APP_DIR}' && docker compose -f docker-compose.vps.yml -f docker-compose.vps.images.yml ps -a && docker inspect --format='{{json .State.Health}}' clipbr-vps-api-1 || true && docker logs --tail=250 clipbr-vps-api-1 2>&1 || true"
