groups:
  - name: picashorts-vps
    rules:
      - alert: PicashortsApiDown
        expr: up{job="picashorts-api"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: PicaShorts API indisponível

      - alert: PicashortsMediaWorkerDown
        expr: up{job="picashorts-media-worker"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: Media-worker indisponível

      - alert: PicashortsOpenDLQ
        expr: clipbr_dead_letters_open > 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: DLQ aberta no pipeline

      - alert: PicashortsOutboxBacklog
        expr: clipbr_outbox_unpublished > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Outbox com eventos pendentes

      - alert: PicashortsRenderingBacklog
        expr: clipbr_queue_jobs{queue="rendering",state="waiting"} > 10
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: Fila de render acumulada

      - alert: PicashortsLongRunningRender
        expr: clipbr_oldest_processing_export_age_seconds > 1800
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Export/render está processando há mais de 30 minutos

      - alert: PicashortsContainerRestarting
        expr: increase(container_start_time_seconds{name!=""}[10m]) > 0
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: Container reiniciado recentemente

      - alert: PicashortsHighMemory
        expr: (1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) > 0.85
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: Uso de memória acima de 85%

      - alert: PicashortsDiskAlmostFull
        expr: (1 - (node_filesystem_avail_bytes{fstype!~"tmpfs|overlay"} / node_filesystem_size_bytes{fstype!~"tmpfs|overlay"})) > 0.80
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: Disco acima de 80%

      - alert: PicashortsCanaryServerErrors
        expr: |
          (
            sum(rate(clipbr_http_requests_total{status=~"5.."}[5m]))
            /
            clamp_min(sum(rate(clipbr_http_requests_total[5m])), 0.001)
          ) > 0.02
        for: 5m
        labels:
          severity: critical
          rollout_gate: canary
        annotations:
          summary: Erros 5xx acima do limite de canário
          description: O canário deve ser interrompido quando a taxa de 5xx ficar acima de 2% por cinco minutos.

      - alert: PicashortsPipelineSuccessBelowSLO
        expr: |
          (
            sum(rate(media_worker_stage_requests_total{result="succeeded"}[15m]))
            /
            clamp_min(sum(rate(media_worker_stage_requests_total[15m])), 0.001)
          ) < 0.95
        for: 10m
        labels:
          severity: critical
          rollout_gate: canary
        annotations:
          summary: Sucesso do pipeline abaixo de 95%
          description: Interromper o rollout e revisar falhas por estágio antes de avançar.

      - alert: PicashortsTranscriptEmpty
        expr: sum(rate(media_worker_errors_total{code=~"TRANSCRIPT_EMPTY|NO_AUDIO_STREAM"}[5m])) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Mídia sem fala ou sem áudio detectada
          description: Verificar se o modo visual está habilitado e se os cortes foram exportados sem legendas.

      - alert: PicashortsJobsStuck
        expr: clipbr_oldest_processing_export_age_seconds > 600
        for: 5m
        labels:
          severity: critical
          rollout_gate: canary
        annotations:
          summary: Job preso por mais de dez minutos
          description: O rollout deve ser pausado até o job ser retomado ou encerrado com estorno.

      - alert: PicashortsMinuteRefundSpike
        expr: sum(rate(clipbr_usage_events_total{event_type="processing.minutes.refunded"}[15m])) > 0.2
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: Estornos de minutos acima do esperado
          description: Inspecionar pipelineRunId, videoId e motivo terminal no Loki antes de continuar o canário.
